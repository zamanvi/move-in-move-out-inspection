name: inspection_report_generator
description: No portal login. Create move-in, move-out, HVAC & property PDF reports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  signature: ^5.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^9.0.0
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
