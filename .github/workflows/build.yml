name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate native Android project
        run: |
          flutter create --platforms=android --org com.zamanvi --project-name move_in_move_out_inspection .
          sed -i 's/android:label="[^"]*"/android:label="Move In Move Out Inspection"/' android/app/src/main/AndroidManifest.xml
          # The printing plugin requires compileSdk/targetSdk >= 33; force a modern SDK
          # regardless of whatever flutter.compileSdkVersion the generator defaulted to.
          # Handles both Groovy (build.gradle) and Kotlin DSL (build.gradle.kts) templates.
          GRADLE_FILE=android/app/build.gradle
          [ -f android/app/build.gradle.kts ] && GRADLE_FILE=android/app/build.gradle.kts
          sed -i \
            -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
            -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
            -e 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' \
            -e 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' \
            -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
            -e 's/targetSdk flutter.targetSdkVersion/targetSdk 36/' \
            "$GRADLE_FILE"
          # Some plugins (e.g. printing) bundle their own Android subproject with an
          # older hardcoded compileSdk. Force every plugin subproject to 36 too.
          printf '%s\n' \
            '' \
            'subprojects {' \
            '    afterEvaluate { proj ->' \
            '        if (proj.hasProperty("android")) {' \
            '            proj.android {' \
            '                compileSdkVersion 36' \
            '            }' \
            '        }' \
            '    }' \
            '}' >> android/build.gradle
          # Gradle's configuration cache has a known bug with the symlinked
          # $GITHUB_WORKSPACE path on hosted runners: it throws "Already watching
          # path" and the build silently fails to report its own output file.
          # https://github.com/gradle/gradle/issues/27940
          printf '%s\n' 'org.gradle.configuration-cache=false' >> android/gradle.properties

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" "$KEYSTORE_KEY_ALIAS" > android/key.properties
          python3 .github/scripts/patch_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK (sideload / manual testing)
        run: |
          echo "--- pwd/ls before build ---"
          pwd
          ls -la
          flutter build apk --release || true
          echo "--- pwd/ls after build ---"
          ls -la
          echo "--- searching whole filesystem for any .apk ---"
          APK=$(find / -xdev -iname "*.apk" 2>/dev/null | grep -v '/root/.gradle\|/opt/hostedtoolcache' | head -1)
          if [ -z "$APK" ]; then
            echo "No .apk file found anywhere on disk - the build genuinely failed."
            find / -xdev -iname "*.apk" 2>/dev/null | head -20
            exit 1
          fi
          echo "Found APK at: $APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk

      - name: Build App Bundle (Play Store upload)
        run: |
          flutter build appbundle --release || true
          AAB=$(find / -xdev -iname "*.aab" 2>/dev/null | grep -v '/root/.gradle\|/opt/hostedtoolcache' | head -1)
          if [ -z "$AAB" ]; then
            echo "No .aab file found anywhere on disk - the build genuinely failed."
            find / -xdev -iname "*.aab" 2>/dev/null | head -20
            exit 1
          fi
          echo "Found AAB at: $AAB"
          mkdir -p build/app/outputs/bundle/release
          cp "$AAB" build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
