name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate native Android project
        run: |
          flutter create --platforms=android --org com.tensai --project-name move_in_move_out_inspection .
          sed -i 's/android:label="[^"]*"/android:label="Move In Move Out Inspection"/' android/app/src/main/AndroidManifest.xml
          # The printing plugin requires compileSdk/targetSdk >= 33; force a modern SDK
          # regardless of whatever flutter.compileSdkVersion the generator defaulted to.
          # Handles both Groovy (build.gradle) and Kotlin DSL (build.gradle.kts) templates.
          GRADLE_FILE=android/app/build.gradle
          [ -f android/app/build.gradle.kts ] && GRADLE_FILE=android/app/build.gradle.kts
          sed -i \
            -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
            -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
            -e 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' \
            -e 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' \
            -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
            -e 's/targetSdk flutter.targetSdkVersion/targetSdk 36/' \
            "$GRADLE_FILE"
          # Some plugins (e.g. printing) bundle their own Android subproject with an
          # older hardcoded compileSdk. Force every plugin subproject to 36 too.
          printf '%s\n' \
            '' \
            'subprojects {' \
            '    afterEvaluate { proj ->' \
            '        if (proj.hasProperty("android")) {' \
            '            proj.android {' \
            '                compileSdkVersion 36' \
            '            }' \
            '        }' \
            '    }' \
            '}' >> android/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (sideload / manual testing)
        run: flutter build apk --release

      - name: Build App Bundle (Play Store upload)
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
